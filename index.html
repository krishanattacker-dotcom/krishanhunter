<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subdomain Tracker Dashboard</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --border: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        h1 {
            font-size: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h1 span {
            color: var(--accent);
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .stat-card h3 {
            font-size: 14px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .stat-card .value {
            font-size: 32px;
            font-weight: bold;
        }

        .stat-card.total .value { color: var(--accent); }
        .stat-card.live .value { color: var(--success); }
        .stat-card.found404 .value { color: var(--warning); }

        /* Search Bar */
        .search-bar {
            width: 100%;
            padding: 12px 20px;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 16px;
            margin-bottom: 20px;
            outline: none;
            transition: border-color 0.3s;
        }

        .search-bar:focus {
            border-color: var(--accent);
        }

        /* Table */
        .table-container {
            background-color: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
        }

        th {
            background-color: rgba(0, 0, 0, 0.2);
            color: var(--text-muted);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover {
            background-color: rgba(255, 255, 255, 0.02);
        }

        /* Badges */
        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            display: inline-block;
        }

        .badge-200 { background-color: rgba(16, 185, 129, 0.2); color: var(--success); }
        .badge-404 { background-color: rgba(245, 158, 11, 0.2); color: var(--warning); }
        .badge-403 { background-color: rgba(239, 68, 68, 0.2); color: var(--danger); }

        .domain-name {
            font-family: 'Courier New', Courier, monospace;
            font-size: 15px;
        }

        .domain-name a {
            color: var(--text-main);
            text-decoration: none;
            transition: color 0.2s;
        }

        .domain-name a:hover {
            color: var(--accent);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🛡️ Subdomain <span>Tracker</span></h1>
    </header>

    <!-- Stats -->
    <div class="stats-grid">
        <div class="stat-card total">
            <h3>Total Found</h3>
            <div class="value" id="total-count">0</div>
        </div>
        <div class="stat-card live">
            <h3>Live (200 OK)</h3>
            <div class="value" id="live-count">0</div>
        </div>
        <div class="stat-card found404">
            <h3>Found (404/403)</h3>
            <div class="value" id="notfound-count">0</div>
        </div>
    </div>

    <!-- Search -->
    <input type="text" id="searchInput" class="search-bar" placeholder="🔍 Search subdomain... (e.g., api, dev, admin)">

    <!-- Data Table -->
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Subdomain</th>
                    <th>Status</th>
                    <th>Title / Tech</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Rows injected by JS -->
            </tbody>
        </table>
        <div class="empty-state" id="emptyState">
            <h2>No subdomains found 😢</h2>
            <p>Try changing your search query.</p>
        </div>
    </div>
</div>

<script>
    // ==========================================
    // DUMMY DATA (Aap yahan apna data daal sakte hain)
    // ==========================================
    const subdomainData = [
        { id: 1, domain: "api.tomtomgroup.com", status: 200, title: "TomTom API Gateway" },
        { id: 2, domain: "dev.tomtomgroup.com", status: 200, title: "Development Server" },
        { id: 3, domain: "admin.tomtomgroup.com", status: 404, title: "Not Found" },
        { id: 4, domain: "staging.tomtomgroup.com", status: 200, title: "Staging Env" },
        { id: 5, domain: "test-api.tomtomgroup.com", status: 403, title: "Forbidden" },
        { id: 6, domain: "vpn.tomtomgroup.com", status: 200, title: "Fortinet VPN" },
        { id: 7, domain: "old-mail.tomtomgroup.com", status: 404, title: "Not Found" },
        { id: 8, domain: "jenkins.tomtomgroup.com", status: 200, title: "Jenkins Dashboard" },
        { id: 9, domain: "blog.tomtomgroup.com", status: 200, title: "Company Blog" },
        { id: 10, domain: "jira.tomtomgroup.com", status: 404, title: "Not Found" }
    ];

    const tableBody = document.getElementById('tableBody');
    const searchInput = document.getElementById('searchInput');
    const totalCount = document.getElementById('total-count');
    const liveCount = document.getElementById('live-count');
    const notFoundCount = document.getElementById('notfound-count');
    const emptyState = document.getElementById('emptyState');

    // 1. Render Data to Table
    function renderTable(data) {
        tableBody.innerHTML = ''; // Clear table first
        
        if (data.length === 0) {
            emptyState.style.display = 'block';
            return;
        } else {
            emptyState.style.display = 'none';
        }

        data.forEach((item, index) => {
            const tr = document.createElement('tr');
            
            // Status Badge Class
            let badgeClass = 'badge-200';
            if (item.status === 404) badgeClass = 'badge-404';
            if (item.status === 403) badgeClass = 'badge-403';

            tr.innerHTML = `
                <td>${index + 1}</td>
                <td class="domain-name">
                    <a href="https://${item.domain}" target="_blank">${item.domain}</a>
                </td>
                <td><span class="badge ${badgeClass}">${item.status}</span></td>
                <td>${item.title}</td>
            `;
            tableBody.appendChild(tr);
        });
    }

    // 2. Update Stats Cards
    function updateStats() {
        totalCount.innerText = subdomainData.length;
        liveCount.innerText = subdomainData.filter(d => d.status === 200).length;
        notFoundCount.innerText = subdomainData.filter(d => d.status !== 200).length;
    }

    // 3. Search Filter Logic
    searchInput.addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase();
        const filteredData = subdomainData.filter(item => 
            item.domain.toLowerCase().includes(query) || 
            item.title.toLowerCase().includes(query)
        );
        renderTable(filteredData);
    });

    // 4. Initialize
    updateStats();
    renderTable(subdomainData);

</script>
</body>
</html>
